# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - careeros

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: careerosregistry.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_79C076DD0ECF45FBAD9D2525AE1BCFBF }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_68B96C93F5AB4316AA2C5943E11E336B }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: careerosregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_79C076DD0ECF45FBAD9D2525AE1BCFBF }}/careeros:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_93F842B5D55D4A89A964C41B57314F32 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B98B8B8D40774A1B904F47603409BA53 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1A20304548D64E19B0192ED3C12BB9E3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'careeros'
          slot-name: 'Production'
          images: 'careerosregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_79C076DD0ECF45FBAD9D2525AE1BCFBF }}/careeros:${{ github.sha }}'
          