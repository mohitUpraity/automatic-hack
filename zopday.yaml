# ZopDay / ZopDev Deployment Manifest for CareerOS
name: careeros-app
version: 3.0.0

deployment:
  strategy: rolling
  replicas: 1

build:
  type: docker
  dockerfile: Dockerfile
  context: .

service:
  type: web
  port: 8000
  protocol: http
  healthCheck:
    path: /api/health
    interval: 10s
    timeout: 3s
    healthyThreshold: 1
    unhealthyThreshold: 3

env:
  - name: PORT
    value: "8000"
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: NODE_ENV
    value: "production"
  - name: ARMORIQ_SHIELD_DEFAULT
    value: "ON"
  - name: GROQ_MODEL
    value: "qwen/qwen3.8-27b"
  - name: GEMINI_LIVE_MODEL
    value: "gemini-3.1-flash-live-preview"
  - name: GROQ_API_KEY
    valueFromSecret: GROQ_API_KEY
  - name: GEMINI_API_KEY
    valueFromSecret: GEMINI_API_KEY
  - name: GOOGLE_API_KEY
    valueFromSecret: GEMINI_API_KEY
  - name: FIRECRAWL_API_KEY
    valueFromSecret: FIRECRAWL_API_KEY
  - name: SUPABASE_URL
    valueFromSecret: SUPABASE_URL
  - name: SUPABASE_ANON_KEY
    valueFromSecret: SUPABASE_ANON_KEY
  - name: SUPABASE_SERVICE_KEY
    valueFromSecret: SUPABASE_SERVICE_ROLE_KEY
  - name: SUPABASE_SERVICE_ROLE_KEY
    valueFromSecret: SUPABASE_SERVICE_ROLE_KEY
  - name: JWT_SECRET
    valueFromSecret: JWT_SECRET

mcp:
  enabled: true
  protocol: stdio
  servers:
    - name: mcp-scout
      command: python3
      args: ["-m", "my_agent.mcp_servers.mcp_scout_server"]
    - name: mcp-docproc
      command: python3
      args: ["-m", "my_agent.mcp_servers.mcp_docproc_server"]
    - name: mcp-knowledge
      command: python3
      args: ["-m", "my_agent.mcp_servers.mcp_knowledge_server"]
    - name: mcp-tailor
      command: python3
      args: ["-m", "my_agent.mcp_servers.mcp_tailor_server"]
